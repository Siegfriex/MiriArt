server:
  port: ${PORT:8080}

# Spring Cloud GCP Cloud SQL 자동설정 비활성화
# (spring-cloud-gcp-starter-storage 포함 시 sql.enabled 명시 필요 — 미설정 시 "database name must be provided" 오류)
spring:
  cloud:
    gcp:
      sql:
        enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      # DB 연결 지연/실패 시에도 앱 기동 허용 (-1: 무한 대기 후 연결 시도)
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      # validate: 운영 환경 고정. 스키마 변경 시 수동 DDL 또는 Flyway 사용
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # dialect·temp는 application.yml 공통 설정 사용
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

miriart:
  jwt:
    secret:
      access: ${JWT_ACCESS_SECRET}
      refresh: ${JWT_REFRESH_SECRET}

logging:
  level:
    root: INFO
    com.miriart.api: INFO
