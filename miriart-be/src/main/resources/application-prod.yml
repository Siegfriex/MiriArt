server:
  port: ${PORT:8080}
  # Cloud Run 등 리버스 프록시 뒤에서 X-Forwarded-Proto/Host 사용 → OAuth redirect_uri가 https로 나가도록
  forward-headers-strategy: framework

# Spring Cloud GCP Cloud SQL 자동설정 비활성화
# (spring-cloud-gcp-starter-storage 포함 시 sql.enabled 명시 필요 — 미설정 시 "database name must be provided" 오류)
spring:
  cloud:
    gcp:
      sql:
        enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      # DB 연결 지연/실패 시에도 앱 기동 허용 (-1: 무한 대기 후 연결 시도)
      initialization-fail-timeout: 30000
  jpa:
    hibernate:
      # validate: 운영 환경 고정. 스키마 변경 시 수동 DDL 또는 Flyway 사용
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # dialect·temp는 application.yml 공통 설정 사용
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: 6379
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
            scope: email, profile
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

miriart:
  auth:
    cookie-same-site: None
  jwt:
    secret:
      access: ${JWT_ACCESS_SECRET}
      refresh: ${JWT_REFRESH_SECRET}

logging:
  level:
    root: INFO
    com.miriart.api: INFO

# Actuator health 노출 (Cloud Run 헬스체크·모니터링용)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
