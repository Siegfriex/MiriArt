spring:
  profiles:
    active: dev
  application:
    name: miriart-api
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        temp:
          use_jdbc_metadata_defaults: false
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

miriart:
  frontend:
    oauth-success-url: ${FRONTEND_OAUTH_SUCCESS_URL:http://localhost:5173}
  auth:
    # Lax: 로컬 same-site. None: prod cross-site(Vercel↔Cloud Run)에서 refresh 쿠키 전송용
    cookie-same-site: Lax
    # 크레딧 한도 미적용(버짓 해제) 이메일. 쉼표 구분. Google 로그인 이메일과 일치하면 한도 체크 생략
    budget-exempt-emails: ${BUDGET_EXEMPT_EMAILS:6siegfriex@gmail.com,6siegfriex@argo.ai.kr}
  fastapi:
    internal-url: ${FASTAPI_INTERNAL_URL:http://localhost:8000}
  jwt:
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  gcs:
    bucket: ${GCS_BUCKET_NAME:miriart-bucket}
    image-url-expiration-minutes: ${IMAGE_URL_EXPIRATION_MINUTES:15}
