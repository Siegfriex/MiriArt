plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.miriart'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}
// BE(seller) 이식: springdoc 버전 고정
configurations.all {
    resolutionStrategy {
        force 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
        force 'org.springdoc:springdoc-openapi-starter-common:2.8.6'
        force 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.6'
    }
}
// BE(seller) 이식: Netty 네이티브 DNS 제외 → UnsatisfiedLinkError 로그 방지
configurations.all {
    exclude group: 'io.netty', module: 'netty-resolver-dns-native-macos'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'com.google.cloud:spring-cloud-gcp-dependencies:6.5.4'
    }
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Security & OAuth2
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // Data
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Cloud Run ↔ Cloud SQL 연결 (프라이빗 IP 대신 소켓 사용)
    runtimeOnly 'com.google.cloud.sql:mysql-socket-factory-connector-j-8:1.25.1'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Actuator (health 등)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // GCS (Google Cloud Storage)
    implementation 'com.google.cloud:spring-cloud-gcp-starter-storage'

    // Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.wiremock:wiremock-standalone:3.3.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Dev
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.named('test') {
    useJUnitPlatform()
    // Gradle 9: 리포트 출력 경로 잠금 시 AccessDeniedException 방지 (Windows/IDE 등)
    doNotTrackState("Test report output may be locked by another process")
}

// 기본 출력 디렉토리 사용 (build). build2 사용 시 일부 환경에서 AccessDenied 발생 가능)

